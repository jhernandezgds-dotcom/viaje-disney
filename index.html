<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuentas del Viaje</title>
<meta name="description" content="Cuotas, aéreos, gastos y saldos del viaje, compartidos entre los dos.">
<meta name="theme-color" content="#BFD9FF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Viaje">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Postal de parque: cielo de día, banderines y globos; tarjetas blancas; coral, sol, verde agua y azul como acentos */
:root{
  --sky1:#BFD9FF; --sky2:#E4EEFF; --blush:#FFF1F5;
  --ink:#13254D; --muted:#4D5F86; --line:#E3E9F5;
  --white:#FFFFFF; --soft:#F4F7FD;
  --coral:#FF6B57; --coral-d:#C63E2B; --coral-bg:#FFE8E3;
  --sun:#FFC93C; --sun-d:#8A5A00; --sun-bg:#FFF3CF;
  --mint:#3CC4A0; --mint-d:#1F6E59; --mint-bg:#E3F7F0;
  --blue:#6E8BFF; --blue-d:#2F48B8; --blue-bg:#E6ECFF;
  --bad:#B4365A; --good:#1E8A5A; --ring-bg:#FFE1EA;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--sky2)}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 34%,var(--blush) 100%) fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:11px 13px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2{margin:0;text-wrap:balance}
[hidden]{display:none!important}

.screen{position:relative;max-width:520px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 52px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.screen.app{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 170px)}
.screen.auth{padding-bottom:40px;gap:16px}
.decor{position:absolute;left:0;top:env(safe-area-inset-top,0px);width:100%;height:112px;pointer-events:none;z-index:0}
.screen.has-decor{padding-top:calc(env(safe-area-inset-top,0px) + 104px)}
.screen>*:not(.decor){position:relative;z-index:1}

.head{display:flex;flex-direction:column;gap:0}
.hello{font-size:14px;font-weight:800;color:var(--coral-d)}
.title{font-family:var(--display);font-size:34px;font-weight:800;line-height:1.02;letter-spacing:-0.01em}
.title.sm{font-size:30px}
.auth-head{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.note.pad{margin:-4px 4px 0}
.center{text-align:center}
.big{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.big.sm{font-size:22px}

.countdown{align-self:flex-start;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--white);border-radius:99px;padding:7px 16px 7px 7px;box-shadow:0 10px 20px -12px rgba(19,37,77,.6)}
.cd-n{background:var(--sun);color:var(--ink);border-radius:99px;min-width:54px;height:38px;display:grid;place-items:center;font-family:var(--display);font-size:21px;font-weight:800;padding:0 9px;font-variant-numeric:tabular-nums}
.cd-t{display:flex;flex-direction:column;font-weight:800;font-size:14px;line-height:1.2}
.cd-t small{font-weight:600;font-size:12.5px;color:#C9D6F2}

.card{background:var(--white);border-radius:24px;box-shadow:0 16px 34px -24px rgba(19,37,77,.45);border:0}
.card.agency{display:flex;align-items:center;gap:16px;padding:18px;text-align:left;width:100%}
.empty-agency{flex-direction:column;align-items:flex-start!important;gap:4px!important}
.ag-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.ring{width:104px;height:104px;border-radius:52px;display:grid;place-items:center;flex:none}
.ring-in{width:80px;height:80px;border-radius:40px;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-n{font-family:var(--display);font-size:26px;font-weight:800;line-height:1}
.ring-l{font-size:11px;font-weight:700;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border:0;border-radius:22px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-width:0}
.t-mint{background:var(--mint-bg)} .t-mint .tl{color:var(--mint-d)}
.t-coral{background:var(--coral-bg)} .t-coral .tl{color:#A6362A}
.tl{font-size:13px;font-weight:800;line-height:1.25}
.tv{font-family:var(--display);font-size:20px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.tv.sm{font-size:16px}

.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px}
.tile .ico{width:34px;height:34px;border-radius:11px}
.tile .ico svg{width:18px;height:18px}
.k-cuota{background:var(--sun-bg);color:var(--sun-d)}
.k-aereo{background:var(--mint-bg);color:var(--mint-d)}
.tile .k-aereo{background:var(--mint);color:var(--white)}
.k-gasto{background:var(--coral-bg);color:var(--coral-d)}
.k-transfer{background:var(--blue-bg);color:var(--blue-d)}
.k-transfer-on{background:var(--coral);color:var(--white)}

.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
.sec-head h2{font-family:var(--display);font-size:20px;font-weight:800}
.list{display:flex;flex-direction:column;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:transparent;border:0;border-top:1px solid var(--line);text-align:left}
.list>.item:first-child,.day+.item{border-top:0}
.item:active{background:var(--soft)}
.mid{flex:1;min-width:0;display:flex;flex-direction:column}
.mid .t{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.coral{color:var(--coral-d)}
.day{padding:10px 14px 4px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;background:var(--soft)}
.debt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line)}
.debt:first-child{border-top:0}
.person{display:flex;flex-direction:column;gap:8px;padding:14px;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.pbar{display:flex;flex-direction:column;gap:5px}
.pbar-top{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.bar{height:9px;border-radius:99px;background:var(--ring-bg);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--sun))}
.empty{padding:26px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;color:var(--muted)}
.empty strong{color:var(--ink);font-size:17px}
.spark{font-size:24px;color:var(--sun)}
.sums{display:flex;flex-direction:column}
.sum{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-top:1px solid var(--line)}
.sum:first-child{border-top:0}

.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:99px;border:1px solid var(--line);background:var(--white);font-weight:800;font-size:14px;padding:9px 16px;min-height:42px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--white)}

.form{display:flex;flex-direction:column;gap:12px;padding:18px}
.form h2{font-family:var(--display);font-size:20px;font-weight:800}
.form p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:800;color:var(--muted);min-width:0}
.btn{border:0;border-radius:99px;background:var(--coral);color:var(--white);font-weight:800;font-size:16px;padding:13px 20px;min-height:48px}
.btn.sm{padding:10px 16px;min-height:44px;font-size:15px}
.btn.grow{flex:1}
.btn:disabled{opacity:.6}
.btn-ghost{border:1px solid var(--line);border-radius:99px;background:var(--white);color:var(--ink);font-weight:800;padding:11px 18px;min-height:46px}
.btn-danger{border:1px solid var(--coral-bg);border-radius:99px;background:var(--white);color:var(--bad);font-weight:800;padding:11px 18px;min-height:46px}
.linkish{background:transparent;border:0;color:var(--coral-d);font-weight:800;font-size:14px;padding:6px 0;align-self:center}
.linkish.left{align-self:flex-start;padding:2px 0;font-size:13px}
.linkish.inline{display:inline;padding:0}
.icon-btn{width:44px;height:44px;border-radius:22px;border:0;background:var(--soft);color:var(--ink);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.person-edit{display:flex;gap:8px;align-items:center}
.person-edit input{flex:1}
.inline-add{display:flex;gap:8px}
.inline-add input{flex:1}
.err{color:var(--bad);font-size:13px;font-weight:700;margin:0}
.ok{color:var(--good);font-size:13px;font-weight:700;margin:0}
.who{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 0}
.toast{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--sun-bg);border-radius:16px;padding:10px 14px;font-size:14px;font-weight:700}
.offline{position:fixed;z-index:40;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--sun-bg);color:var(--ink);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:800;box-shadow:0 6px 16px -8px rgba(19,37,77,.5)}

/* Botón y barra inferior */
.cta-wrap{position:fixed;z-index:15;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);padding:0 max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none}
.cta{pointer-events:auto;width:100%;max-width:484px;min-height:56px;border-radius:28px;border:0;background:linear-gradient(90deg,var(--coral),#FF8A5C);color:var(--white);font-family:var(--display);font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 14px 26px -12px rgba(198,62,43,.8)}
.cta svg{width:22px;height:22px}
.tabbar{position:fixed;z-index:16;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid #F2D9E2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{background:transparent;border:0;font-size:11.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center}
.tabbar button svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--coral-d);font-weight:800}

/* Ficha para añadir */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(19,37,77,.4);display:flex;align-items:flex-end;justify-content:center;padding-top:max(24px,env(safe-area-inset-top,0px))}
.sheet{width:100%;max-width:560px;max-height:100%;overflow:auto;background:var(--white);border-radius:28px 28px 0 0;padding:16px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:620px){.scrim{align-items:center;padding:24px}.sheet{border-radius:28px}}
.sheet-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.sheet-head h2{text-align:center;font-family:var(--display);font-size:21px;font-weight:800}
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kind{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--white);border-radius:16px;padding:8px 10px;font-weight:800;font-size:14px;text-align:left;min-height:52px}
.kind .ico{width:34px;height:34px;border-radius:11px}
.kind .ico svg{width:18px;height:18px}
.kind[aria-pressed="true"]{border:2px solid var(--ink);padding:7px 9px;background:var(--soft)}
.hint{margin:0;font-size:13px;color:var(--muted);background:var(--soft);border-radius:14px;padding:10px 12px}
.amount-field{display:flex;flex-direction:column;gap:5px}
.amount-field .lbl{font-size:13px;font-weight:800;color:var(--muted)}
.amount-in{display:flex;gap:8px;align-items:stretch}
.amount-in input{font-size:22px;font-weight:800;flex:1;font-family:var(--display)}
.cur-switch{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px;flex:none}
.cur-switch button{background:transparent;border:0;color:var(--muted);border-radius:11px;padding:6px 10px;font-size:14px;font-weight:800}
.cur-switch button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.split-head{display:flex;justify-content:space-between;padding:10px 14px;background:var(--soft);font-size:13px;font-weight:800;color:var(--muted)}
.split-row{display:flex;flex-direction:row;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;color:var(--ink);font-size:15px;font-weight:700}
.split-row input{width:22px;height:22px;padding:0;accent-color:var(--coral);flex:none}
.split-amt{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap}

@media (prefers-reduced-motion:no-preference){
  .float1{animation:bob 6s ease-in-out infinite}
  .float2{animation:bob 7s ease-in-out infinite reverse}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="root"><div class="screen auth"><p class="note center">Cargando…</p></div></div>
<script type="module" src="app.js?v=5"></script>
</body>
</html>
