<!doctype html>
<html lang="es" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Viaje a Disney · Cuentas del Viaje</title>
<meta name="description" content="Cuotas, aéreos, gastos y saldos del viaje, compartidos entre los dos.">
<meta name="theme-color" content="#3793ef">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Viaje">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<script>
/* Día/noche antes de pintar: Automático usa la hora de Buenos Aires (día 07:00–18:59, noche 19:00–06:59). */
(function () {
  var r = document.documentElement, m = "day";
  try {
    var p = localStorage.getItem("themePref") || "auto";
    if (p === "day" || p === "night") m = p;
    else {
      var h = +new Intl.DateTimeFormat("en-GB", { hour: "2-digit", hourCycle: "h23", timeZone: "America/Argentina/Buenos_Aires" }).format(new Date()) % 24;
      m = h >= 7 && h < 19 ? "day" : "night";
    }
  } catch (e) {}
  r.setAttribute("data-theme", m);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* ===== Sistema visual aprobado «Viaje a Disney» (día / noche) ===== */
:root, html[data-theme="day"] {
  --display: 'Berkshire Swash', Georgia, serif; --nfont: 'Nunito', system-ui, -apple-system, Arial, sans-serif; --serif: Georgia, 'Times New Roman', serif;
  --page: linear-gradient(165deg, #b6dcff 0, #f2ddfd 35%, #fff0e7 70%, #fbe2ed 100%);
  --html-bg: #f2ddfd;
  --text: #261650; --muted: #745c8d; --panel: #fff9f2; --panel2: #fff7f0; --panel-grad: #fff9f2; --panel-border: #f4c18b;
  --button1: #aa59dc; --button2: #6921ab; --line: #ecd5d9; --soft: #f5e6fc; --tab: #fffbf1ee; --input: #fffdf9; --input-border: #c8b5cd;
  --badge: #f8d9e3; --shadow: 0 6px 16px #b15b9f2a; --accent: #7033b7; --on-accent: #fff;
  --bar-bg: #d9d0e0; --bar: linear-gradient(180deg, #bf7be9, #7533bb);
  --good: #11744a; --good-bg: #c9f3df; --good-border: #8fdcb6; --bad: #a43a5c; --bad-bg: #ffd9e3; --bad-border: #f3a9bf;
  --month-bg: #ead4fa; --month-text: #391e76; --hero-fade: #ead5ff33;
  --hint-bg: #fff4df; --hint-text: #68417c; --hint-border: #edd1ac;
  --err-bg: #ffe3e6; --err: #a52a3a; --ok-bg: #dcf6e8; --ok: #11744a;
  color-scheme: light;
}
html[data-theme="night"] {
  --page: linear-gradient(168deg, #091953 0, #162361 35%, #322a82 74%, #4b318e 100%);
  --html-bg: #101d5c;
  --text: #fff8ee; --muted: #d0c6ea; --panel: #242e77; --panel2: #1e2b73; --panel-grad: linear-gradient(122deg, #1c2b70, #3b367d 95%); --panel-border: #b6a8e2;
  --button1: #293a82; --button2: #172057; --line: #ffffff2b; --soft: #303985; --tab: #182860f2; --input: #1d296d; --input-border: #8996cc;
  --badge: #39458c; --shadow: 0 6px 16px #0107394f; --accent: #f6c45e; --on-accent: #172057;
  --bar-bg: #ffffff2e; --bar: linear-gradient(180deg, #ffe3a0, #ffbd49);
  --good: #08392a; --good-bg: #5fe3a7; --good-border: #a6ffcb; --bad: #4d1028; --bad-bg: #ffb3c8; --bad-border: #ffd5e4;
  --month-bg: #4c428e; --month-text: #fff9e9; --hero-fade: #1a246655;
  --hint-bg: #fff0cf; --hint-text: #3d2d65; --hint-border: #e4b65d;
  --err-bg: #5a1a35; --err: #ffd5e0; --ok-bg: #134d3c; --ok: #b9ffd9;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--html-bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; font-family: var(--nfont); color: var(--text); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0; z-index: -2; background: var(--page); transition: background .4s ease; }
html[data-theme="night"] body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .4;
  background-image: radial-gradient(2px 2px at 9% 6%, #ffe6a4, transparent), radial-gradient(2px 2px at 54% 15%, #fff9dd, transparent), radial-gradient(2px 2px at 86% 44%, #fff1bb, transparent), radial-gradient(1px 1px at 32% 64%, #fff, transparent), radial-gradient(2px 2px at 76% 85%, #f4c6f6, transparent);
  background-size: 180px 195px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #e6a12a; outline-offset: 2px; }
svg { display: block; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.only-night { display: none !important; }
html[data-theme="night"] .only-day { display: none !important; }
html[data-theme="night"] .only-night { display: block !important; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* ----- Estructura ----- */
.shell { max-width: 480px; margin: 0 auto; position: relative; min-height: 100vh; padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
.shell.auth-shell { padding-bottom: 40px; }
.page-content { padding: 12px 14px 0; position: relative; z-index: 1; }
.page-content.compact { padding-top: 10px; }

/* ----- Encabezados ilustrados ----- */
.hero { position: relative; overflow: hidden; width: 100%; aspect-ratio: 330 / 150; background: linear-gradient(150deg, #66baf8 0, #c3c7ff 50%, #ffc9de 100%); }
html[data-theme="night"] .hero { background: linear-gradient(150deg, #0d226c 0, #261b73 55%, #57339c 100%); }
.hero.h-inicio { aspect-ratio: 397 / 219; }
.hero.h-anadir, .hero.h-ajustes { aspect-ratio: 330 / 96; }
.hero-layer { position: absolute; inset: 0; }
.hero-photo { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-layer.decorated::before { content: "✦  ·  ✧  ⋆  ✦"; color: #fff0b2; text-shadow: 0 0 10px #fff3c9; position: absolute; top: 10px; left: 12px; font-size: 20px; letter-spacing: 16px; z-index: 1; opacity: .75; }
.hero-layer.decorated::after { content: ""; pointer-events: none; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 65%, var(--hero-fade) 100%); }
.hero-text { position: absolute; z-index: 2; inset: 0; display: flex; align-items: center; justify-content: center; padding: 8px 12px 0; text-align: center; font-family: var(--display); font-weight: 400; font-size: clamp(36px, 11.5vw, 52px); color: #3b197b; text-shadow: 0 1px 1px #fff9ed; }
html[data-theme="night"] .hero-text { color: #fff3ce; text-shadow: 0 0 8px #ffbf65, 0 0 18px #f1a6475b; }
.decor-stars { position: absolute; z-index: 2; left: 12%; bottom: 14px; font-size: 26px; color: #ffecb6; filter: drop-shadow(0 0 7px #f5a42b); }
.hero-back { position: absolute; z-index: 3; left: 3%; top: 50%; transform: translateY(-50%); width: 12%; aspect-ratio: 1; border-radius: 50%; border: 0; background: transparent; }

/* ----- Herramientas del encabezado (campana y apariencia) ----- */
.head-tools { position: absolute; z-index: 8; top: calc(8px + env(safe-area-inset-top)); right: 10px; display: flex; gap: 6px; align-items: flex-start; }
.head-tool { position: relative; display: inline-flex; align-items: center; gap: 5px; min-height: 34px; background: #fff5e5e0; border: 1px solid #ffdb8a; color: #4b258b; border-radius: 99px; padding: 5px 10px; font-size: 12px; font-weight: 900; box-shadow: 0 2px 8px #35196b29; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.head-tool svg { width: 16px; height: 16px; }
.head-tool.round { width: 34px; padding: 0; justify-content: center; }
html[data-theme="night"] .head-tool { background: #1b276bc4; color: #fff0c0; border-color: #e4b65d; }
.badge { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 99px; background: #ff5a7a; color: #fff; font-size: 10px; font-weight: 900; display: grid; place-items: center; border: 2px solid #fff; }
.theme-options { position: absolute; top: 40px; right: 0; min-width: 170px; box-shadow: 0 7px 18px #110e3d4b; padding: 5px; border-radius: 13px; background: var(--panel2); border: 1px solid var(--panel-border); display: flex; flex-direction: column; gap: 3px; }
.theme-options button { display: flex; align-items: center; gap: 8px; background: transparent; border: 0; border-radius: 8px; color: var(--text); font-size: 13px; text-align: left; font-weight: 900; padding: 9px 12px; }
.theme-options button svg { width: 16px; height: 16px; color: var(--accent); }
.theme-options button[aria-checked="true"] { background: var(--soft); }
.theme-options small { display: block; font-size: 10px; color: var(--muted); font-weight: 700; padding: 2px 12px 6px; max-width: 190px; }

/* ----- Tarjetas ----- */
.card { display: block; width: 100%; text-align: left; border: 1.5px solid var(--panel-border); background: var(--panel); background: var(--panel-grad); color: var(--text); border-radius: 21px; margin: 0 0 11px; box-shadow: var(--shadow); padding: 16px; position: relative; }
button.card { cursor: pointer; font: inherit; }
.card.important { border-color: #edbe70; }
html[data-theme="night"] .card.important { box-shadow: 0 0 0 1px #f6c46e5e, 0 0 19px #b58ae533; }
.card.smaller { padding: 12px 14px; border-radius: 17px; }
.card.cream { background: #fff8ee; }
html[data-theme="night"] .card.cream { background: linear-gradient(180deg, #fff6e6, #ffeccc); color: #2b1d5c; border-color: #ffd48d; --muted: #6a5a86; --accent: #6a32b0; --line: #ead6b8; }
.card-head { display: flex; align-items: center; gap: 12px; }
.icon-box { width: 42px; height: 42px; flex: none; display: grid; place-items: center; color: var(--accent); }
.icon-box svg { width: 32px; height: 32px; }
.flex1 { flex: 1; min-width: 0; }
.card-title { font-family: var(--serif); font-weight: bold; font-size: 17px; line-height: 1.2; }
.card-sub { font-size: 12px; font-weight: 800; color: var(--muted); line-height: 1.35; }
.big-number { font-family: var(--serif); font-size: 24px; font-weight: 900; line-height: 1.25; letter-spacing: -.02em; }
.big-number small { font-size: 14px; font-weight: 500; }
.big-number .spark { font-size: 18px; color: #e0a63b; }
.mini-tag { margin-left: auto; border-radius: 16px; padding: 5px 10px; background: var(--badge); font-weight: 900; font-size: 13px; white-space: nowrap; }
html[data-theme="night"] .mini-tag { border: 1px solid #e4b65d; color: #ffe6a2; }
.progress { margin-top: 11px; height: 13px; border-radius: 20px; background: var(--bar-bg); box-shadow: inset 0 1px 2px #74628d36; overflow: hidden; }
.progress.thin { height: 9px; margin-top: 8px; }
.progress > span { display: block; height: 100%; border-radius: 20px; background: var(--bar); transition: width .3s; }
html[data-theme="night"] .progress > span { box-shadow: 0 0 8px #eab65b95; }
.progress.over > span { background: linear-gradient(180deg, #ff9aa8, #e0455f); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 2px; }
.subtle, .note { color: var(--muted); font-size: 12px; font-weight: 700; line-height: 1.45; }
.note.center { text-align: center; display: block; }
.tiny-note { font-size: 11px; line-height: 1.5; color: var(--muted); font-weight: 700; }
.space { height: 10px; }
.section-caption { font-weight: 900; font-size: 13px; margin: 14px 5px 8px; color: var(--text); }
.page-heading { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 2px 9px; }
.page-heading h2 { font-size: 18px; margin: 0; font-weight: 900; }
.stats-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 11px; }
.stats-2 .card { margin: 0; }
.hint { display: block; background: var(--hint-bg); color: var(--hint-text); font-size: 12px; font-weight: 700; border: 1px solid var(--hint-border); padding: 9px 11px; border-radius: 13px; line-height: 1.5; margin: 10px 0; }
.err { background: var(--err-bg); color: var(--err); border-radius: 12px; padding: 9px 11px; font-weight: 800; font-size: 13px; margin: 10px 0; }
.ok { background: var(--ok-bg); color: var(--ok); border-radius: 12px; padding: 9px 11px; font-weight: 800; font-size: 13px; margin: 10px 0; }
.ok-line { color: var(--good-text, #1b8a56); font-weight: 900; font-size: 13px; display: flex; gap: 6px; align-items: center; margin-top: 8px; }
html[data-theme="night"] .ok-line { color: #8ff0bf; }
.ok-line svg, .warn-line svg { width: 18px; height: 18px; flex: none; }
.warn-line { color: #b45a1c; font-weight: 900; font-size: 13px; display: flex; gap: 6px; align-items: flex-start; margin-top: 8px; line-height: 1.4; }
html[data-theme="night"] .warn-line { color: #ffd38a; }
.pill { display: inline-block; border-radius: 99px; padding: 2px 8px; font-size: 11px; font-weight: 900; }
.pill.over { background: var(--bad-bg); color: var(--bad); }
.pill.ok { background: var(--good-bg); color: var(--good); }

/* ----- Botones ----- */
.primary, .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: linear-gradient(180deg, var(--button1), var(--button2)); border: 1.5px solid #c894f7; border-radius: 999px; color: #fff; font-size: 17px; font-weight: 900; padding: 13px 17px; box-shadow: 0 4px 10px #6025ad35; text-align: center; text-decoration: none; }
.primary svg, .btn svg { width: 22px; height: 22px; color: #ffd46c; }
html[data-theme="night"] .primary, html[data-theme="night"] .btn { border-color: #fbd083; box-shadow: 0 0 0 2px #e6b36333, 0 0 14px #f4b7514f; color: #fff6e0; }
.btn { font-size: 15px; padding: 11px 15px; margin-top: 12px; }
.btn[disabled], .primary[disabled] { opacity: .6; }
.secondary-btn, .btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1.4px solid var(--panel-border); border-radius: 999px; background: var(--panel2); color: var(--text); padding: 8px 13px; font-weight: 900; font-size: 12px; text-decoration: none; }
.secondary-btn svg, .btn-ghost svg { width: 16px; height: 16px; color: var(--accent); }
.btn-ghost { width: 100%; margin-top: 10px; font-size: 14px; padding: 11px; }
html[data-theme="night"] .secondary-btn, html[data-theme="night"] .btn-ghost { background: #182560; color: #fff8e5; border-color: #ffce81; }
.secondary-btn.xs { padding: 6px 10px; font-size: 11px; white-space: nowrap; flex: none; }
.secondary-btn.wide { width: 100%; padding: 11px; font-size: 13px; }
.btn-danger { display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid #e0798f; background: transparent; color: #c23a59; border-radius: 999px; padding: 9px 14px; font-weight: 900; font-size: 13px; }
html[data-theme="night"] .btn-danger { color: #ffb3c4; border-color: #ff9db3; }
.outline-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 2px solid var(--accent); background: var(--panel2); color: var(--text); border-radius: 999px; padding: 12px 15px; font-family: var(--serif); font-weight: bold; font-size: 17px; }
.outline-btn svg { width: 22px; height: 22px; color: var(--accent); }
html[data-theme="night"] .outline-btn { background: #182560; box-shadow: 0 0 12px #f4b75133; }
.inline-action, .linkish { border: 0; background: transparent; color: var(--text); text-decoration: underline; text-underline-offset: 3px; font-size: 12px; font-weight: 900; padding: 7px 5px; display: inline-flex; align-items: center; gap: 4px; }
.linkish.block { display: block; margin: 6px auto 0; font-size: 13px; }
.icon-btn { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--panel-border); background: var(--panel2); color: var(--text); display: grid; place-items: center; }
.icon-btn svg { width: 18px; height: 18px; }
.chev { width: 22px; height: 22px; color: var(--text); flex: none; }
.wa-btn { display: inline-flex; align-items: center; gap: 6px; flex: none; background: linear-gradient(180deg, #2fc76a, #169a4c); color: #fff; border: 1px solid #9be8b8; border-radius: 14px; padding: 8px 10px; font-weight: 900; font-size: 12px; line-height: 1.15; text-decoration: none; }
.wa-btn svg { width: 20px; height: 20px; }

/* ----- Navegación inferior ----- */
.bottom-nav { position: fixed; z-index: 20; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--tab); border-top: 1px solid var(--panel-border); border-radius: 25px 25px 0 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px 6px calc(8px + env(safe-area-inset-bottom)); box-shadow: 0 -3px 15px #ae6dd91d; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.bottom-nav button { border: 0; background: none; color: var(--text); font-weight: 900; font-size: 11px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 3px; border-radius: 18px; min-height: 58px; padding: 4px 0; min-width: 0; }
.bottom-nav button svg { width: 23px; height: 23px; }
.bottom-nav button[aria-current="page"] { background: #e9d4f5; color: #5c238f; }
html[data-theme="night"] .bottom-nav button[aria-current="page"] { color: #ffe0a0; background: linear-gradient(160deg, #4b3f90, #182a6d); box-shadow: 0 0 9px #fbc65a8c, inset 0 0 0 1px #e8b450; }

/* ----- Pagos ----- */
.filterbar { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; margin: 2px -2px 12px; padding: 3px 3px 7px; }
.filterbar::-webkit-scrollbar { display: none; }
.filter { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-width: 46px; min-height: 40px; font-weight: 900; border-radius: 18px; border: 1px solid #ddc7e4; background: var(--panel2); color: var(--text); padding: 8px 13px; white-space: nowrap; font-size: 13px; }
.filter svg { width: 20px; height: 20px; color: var(--accent); }
.filter[aria-pressed="true"] { background: linear-gradient(160deg, #a957d9, #6f2ab1); color: #fff; border-color: transparent; box-shadow: 0 4px 9px #7f34a53c; }
.filter[aria-pressed="true"] svg { color: #fff; }
html[data-theme="night"] .filter { border-color: #8996cc; }
html[data-theme="night"] .filter[aria-pressed="true"] { background: #fff0cc; color: #172257; }
html[data-theme="night"] .filter[aria-pressed="true"] svg { color: #172257; }
.month { font-family: var(--serif); font-weight: bold; font-size: 16px; padding: 9px 13px; border-radius: 14px 14px 0 0; background: var(--month-bg); color: var(--month-text); margin-top: 12px; }
.card.entry-list { border-radius: 0 0 18px 18px; padding: 2px 4px; margin-bottom: 10px; }
.entry { width: 100%; display: flex; gap: 10px; align-items: center; padding: 11px 8px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: inherit; text-align: left; }
.entry:last-child { border-bottom: 0; }
.entry-icon { width: 32px; flex: none; color: var(--accent); display: grid; place-items: center; }
.entry-icon svg { width: 26px; height: 26px; }
.entry-text { flex: 1; min-width: 0; }
.entry-title { display: block; font-size: 14px; font-weight: 900; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; }
.entry-sub { display: block; font-size: 11px; color: var(--muted); font-weight: 800; margin-top: 2px; }
.amount-chip { flex: none; background: var(--panel2); color: var(--text); padding: 6px 9px; border: 1px solid var(--panel-border); border-radius: 16px; font-size: 12px; font-weight: 900; white-space: nowrap; }
.check-ok { flex: none; width: 22px; height: 22px; border-radius: 50%; background: #3cbf7c; color: #fff; display: grid; place-items: center; }
.check-ok svg { width: 13px; height: 13px; }
.sums { display: flex; gap: 14px; flex-wrap: wrap; }
.sums .sum { flex: 1; min-width: 140px; }

/* ----- Saldos ----- */
.segment { display: flex; padding: 4px; background: var(--soft); border: 1px solid var(--panel-border); border-radius: 99px; gap: 4px; margin-bottom: 12px; }
.segment button { border: 0; border-radius: 99px; background: transparent; color: var(--text); font-size: 14px; font-weight: 900; flex: 1; padding: 9px 5px; }
.segment button[aria-pressed="true"] { color: #311e66; background: #fff6eb; box-shadow: 0 2px 7px #23105723; }
html[data-theme="night"] .segment button[aria-pressed="true"] { color: #132054; background: #ffe6b7; }
.person-card { display: flex; align-items: center; gap: 12px; }
.avatar { width: 46px; height: 46px; flex: none; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; color: var(--accent); background: var(--soft); }
.avatar svg { width: 26px; height: 26px; }
.bal-pill { flex: none; border-radius: 99px; padding: 7px 12px; font-weight: 900; font-size: 16px; white-space: nowrap; border: 1px solid; }
.bal-pill.pos { background: var(--good-bg); color: var(--good); border-color: var(--good-border); }
.bal-pill.neg { background: var(--bad-bg); color: var(--bad); border-color: var(--bad-border); }
.bal-pill.zero { background: var(--soft); color: var(--muted); border-color: var(--panel-border); }
